
name: Build KING DATA CENTER PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p KING_DATA_CENTER_PRO/android-companion assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-DATA-CENTER-PRO-APK
          path: KING_DATA_CENTER_PRO/android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
